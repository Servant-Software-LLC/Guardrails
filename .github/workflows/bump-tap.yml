# Hands-off Homebrew publish: after the Release workflow succeeds, read the checksums the
# release job uploaded, regenerate the formula from the committed template, and PUSH it
# straight to the tap's default branch.
#
# Why a direct push and not a PR (#413): this used to open a PR with
# peter-evans/create-pull-request. Nothing on the other end ever merged them, so they
# accumulated silently — 21 open bump PRs by 2026-08-01, `Formula/guardrails.rb` absent
# from the tap entirely, and `brew install servant-software-llc/tap/guardrails` failing
# outright while the release workflow reported success on every run. The formula is
# generated by substituting a version and four checksums into a committed template: there
# is no human judgement in it, so the PR was a publish step wearing a code-review costume,
# and the review never happened because there was nothing to review. GoReleaser and
# cargo-dist push tap updates directly for exactly this reason.
#
# The review gate is replaced by a REAL post-publish check (`verify` below) that installs
# the published formula on a macOS runner — which catches the actual failure modes (a bad
# checksum, a malformed template) that an unmerged PR never did.
#
# Trigger note: this uses `workflow_run`, NOT `release: published`. A release created inside
# the Release workflow by the built-in GITHUB_TOKEN does not emit events that start new
# workflows, so `release: published` would never fire. `workflow_run` fires regardless.
#
# Requires ONE secret: TAP_PAT — a fine-grained PAT with Contents:write on
# Servant-Software-LLC/homebrew-tap. (Pull-requests:write is no longer needed.)
name: Bump Homebrew tap

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump to (e.g. v1.0.0-preview.2)"
        required: true

permissions:
  contents: read

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    # Only on a successful, tag-driven Release run (head_branch holds the tag for tag pushes),
    # or a manual dispatch.
    #
    # `-ci.` throwaway dry-run tags (e.g. v0.0.0-ci.1) are EXCLUDED, matching release.yml's
    # publish job. This did not matter while the workflow only opened a PR nobody merged; now
    # that it pushes directly, a dry-run tag would publish a junk formula to the live tap.
    if: >-
      !contains(github.event.inputs.tag || github.event.workflow_run.head_branch, '-ci.') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        startsWith(github.event.workflow_run.head_branch, 'v')))
    steps:
      - name: Checkout Guardrails at the released commit (for the formula template)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Resolve tag + version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}"
          [ -n "$TAG" ] || { echo "no tag resolved" >&2; exit 1; }
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Read sha256 for the four Homebrew RIDs
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ steps.v.outputs.tag }}"; VER="${{ steps.v.outputs.version }}"
          d="$RUNNER_TEMP/sha"; mkdir -p "$d"
          read_sha() {
            gh release download "$TAG" -R "$REPO" \
              -p "guardrails-$VER-$1.tar.gz.sha256" -D "$d" --clobber
            awk '{print $1}' "$d/guardrails-$VER-$1.tar.gz.sha256"
          }
          {
            echo "osx_arm64=$(read_sha osx-arm64)"
            echo "osx_x64=$(read_sha osx-x64)"
            echo "linux_arm64=$(read_sha linux-arm64)"
            echo "linux_x64=$(read_sha linux-x64)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the tap
        uses: actions/checkout@v6
        with:
          repository: Servant-Software-LLC/homebrew-tap
          token: ${{ secrets.TAP_PAT }}
          path: tap
          # Keep the PAT in the local git config so the push below authenticates.
          persist-credentials: true

      - name: Render formula from template
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          sed \
            -e "s/@VERSION@/${{ steps.v.outputs.version }}/g" \
            -e "s/@SHA_OSX_ARM64@/${{ steps.sha.outputs.osx_arm64 }}/g" \
            -e "s/@SHA_OSX_X64@/${{ steps.sha.outputs.osx_x64 }}/g" \
            -e "s/@SHA_LINUX_ARM64@/${{ steps.sha.outputs.linux_arm64 }}/g" \
            -e "s/@SHA_LINUX_X64@/${{ steps.sha.outputs.linux_x64 }}/g" \
            .github/templates/guardrails.rb.tmpl > tap/Formula/guardrails.rb
          echo "----- rendered formula -----"; cat tap/Formula/guardrails.rb
          # A leftover placeholder means a checksum asset was missing and `sed` left @SHA_*@
          # verbatim — publishing that would produce a formula that can never install.
          if grep -q '@[A-Z_]*@' tap/Formula/guardrails.rb; then
            echo "::error::rendered formula still contains an unsubstituted placeholder" >&2
            exit 1
          fi

      - name: Publish the formula to the tap (direct push)
        working-directory: tap
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/guardrails.rb; then
            echo "Formula already at ${{ steps.v.outputs.version }} — nothing to publish."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/guardrails.rb
          git commit -m "guardrails ${{ steps.v.outputs.version }}"
          # Rebase-retry: the sibling repo's release can push its own formula concurrently.
          for attempt in 1 2 3; do
            if git push; then
              echo "Published guardrails ${{ steps.v.outputs.version }} to the tap."
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto the tap head and retrying"
            git pull --rebase
          done
          echo "::error::could not push the formula to the tap after 3 attempts" >&2
          exit 1

  # The check the PR gate was only pretending to be (#413). An unmerged PR proved nothing;
  # this installs what was actually published and runs it. Catches a bad checksum or a
  # malformed template — the real failure modes — on the platform most users install from.
  verify:
    name: verify (brew install from the tap)
    needs: [bump]
    runs-on: macos-latest
    steps:
      - name: brew install from the tap and assert the version
        run: |
          set -euo pipefail
          VER="${{ needs.bump.outputs.version }}"
          brew tap servant-software-llc/tap
          brew install servant-software-llc/tap/guardrails
          # `guardrails --version` prints the bare version, which must match what we published.
          OUT="$(guardrails --version)"
          echo "guardrails --version -> $OUT"
          case "$OUT" in
            *"$VER"*) echo "ok: installed formula reports $VER" ;;
            *) echo "::error::installed guardrails reports '$OUT', expected '$VER'" >&2; exit 1 ;;
          esac

      - name: brew test (runs the formula's own test block)
        run: brew test servant-software-llc/tap/guardrails

      # ADVISORY for now. `brew audit --strict` enforces Homebrew's evolving style rules, so a
      # rule change upstream could block an otherwise-good release — and a blocked release is a
      # worse failure than a lint nit. Promote this to a hard gate (drop continue-on-error) once
      # a release has shown the generated formula audits clean.
      - name: brew audit --strict (advisory)
        continue-on-error: true
        run: brew audit --strict --formula servant-software-llc/tap/guardrails
