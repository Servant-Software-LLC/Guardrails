name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    name: build-and-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      # fetch-depth: 0 is REQUIRED, not a convenience. ProducerCoverageCorpusTests is GR2060's corpus
      # sweep and it reasons over history: it rebuilds each plan folder as it stood at a pinned commit
      # (`git archive`) and derives each pre-run commit as "the first commit adding a task.json here".
      # At the action's default depth of 1 both questions get wrong answers from a one-commit history —
      # every path looks added at the tip — which is how CI came to report 04-dogfood-cost-cap's pre-run
      # commit as the plan-33 MERGE and false-red a table that was correct.
      # It also silently SKIPPED four tests whose commits a shallow clone cannot see, including
      # ThePositiveControl_FiresExactlyOnce_At544f7d5 — the single load-bearing measurement proving
      # GR2060 still FIRES. A sweep of nothing but zeroes cannot tell a working check from a mute one,
      # so at depth 1 the whole sweep was running as a formality.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # --locked-mode fails the build if restore would resolve anything other than the committed
      # packages.lock.json — guaranteeing CI and every developer use a byte-identical NuGet graph
      # (including analyzer packages). To intentionally change versions, bump the package reference
      # and re-run `dotnet restore --force-evaluate`, which updates the lock files.
      - name: Restore
        run: dotnet restore Guardrails.sln --locked-mode

      - name: Build
        run: dotnet build Guardrails.sln --configuration Release --no-restore

      # Kept per-project ON PURPOSE even though solution-wide-test (below) covers the same tests: a red
      # X here NAMES the assembly, which is worth a step. What it cannot do is produce CONTENTION —
      # these are sequential, so one assembly always has the machine to itself. That is the gap #566
      # is about; solution-wide-test closes it.
      - name: Test (Core)
        run: dotnet test tests/Guardrails.Core.Tests/Guardrails.Core.Tests.csproj --configuration Release --no-build

      - name: Test (Integration)
        run: dotnet test tests/Guardrails.Integration.Tests/Guardrails.Integration.Tests.csproj --configuration Release --no-build

      # Guard the committed golden example's diagram.md against drift: `graph --check` recomputes
      # the plan's semantic source hash and compares it to the one stamped in the committed file.
      # Exit 0 = fresh, 2 = stale/missing (regenerate with `guardrails graph <folder>`). If the
      # plan changes without regenerating the diagram, this fails CI. (#3)
      - name: Example diagram is fresh (graph --check)
        run: dotnet run --project src/Guardrails.Cli --configuration Release --no-build -- graph examples/hello-guardrails/hello-guardrails --check

  # Issue #566 — run the suite the way a CONTRIBUTOR runs it. `dotnet test Guardrails.sln` executes the
  # Core and Integration assemblies CONCURRENTLY; the per-project steps above run them one after the
  # other, so the oversubscription that a whole-solution run creates cannot arise there at all. The gate
  # was therefore structurally blind to a whole class of defect — and not theoretically. Five fragile
  # tests shipped in one week and were caught, respectively, by: the terminal gate on a merged tree
  # (CircuitOpensAtExactlyFiveConsecutiveFailures), `dotnet test Guardrails.sln` and nothing else
  # (BackoffScheduleIsOneTwoFourWithJitter, NoNoticeTextEverContainsTheAuthValue), the macOS runner and
  # nothing else (FullQueueDropsTheOldestNotTheNewest), and human review (CircuitNeverCloses, which had
  # silently stopped testing anything). TWO OF THE FIVE would have merged green under the old shape.
  #
  # All three OSes, not just one. macOS is where contention bit hardest — FullQueueDropsTheOldestNotThe-
  # Newest failed there on a commit a sibling macOS run passed — but "hardest" is not "only", and the
  # mechanisms differ per platform (process-spawn cost on Windows, scheduler behaviour on Linux, the
  # weaker macOS runner). On a PUBLIC repository GitHub-hosted runners are free, so the marginal cost is
  # this job's own wall-clock, spent in parallel with the matrix above rather than added to it.
  #
  # REQUIRED, not advisory. `continue-on-error: true` would make it a green tick that certifies nothing,
  # which is the exact failure shape this repo has already paid for twice (tests skipping silently in
  # CI; a GR2060 control that had never once fired). If this job goes red the answer is to fix the test
  # it names — a timing-sensitive test that only survives a machine it has to itself is a real defect,
  # not a CI inconvenience.
  #
  # It duplicates restore+build rather than appending a third step to build-and-test: a separate job
  # keeps the check name unambiguous and keeps the whole-solution run off the other job's critical path.
  # fetch-depth: 0 is required here for the same reason it is above (ProducerCoverageCorpusTests reasons
  # over history and SKIPS, silently, on a shallow clone).
  solution-wide-test:
    name: solution-wide-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Guardrails.sln --locked-mode

      - name: Build
        run: dotnet build Guardrails.sln --configuration Release --no-restore

      # The load-bearing line of this whole job: ONE invocation, both assemblies, concurrently.
      - name: Test (whole solution — both assemblies concurrently)
        run: dotnet test Guardrails.sln --configuration Release --no-build

  # End-to-end packaged-tool smoke (#171): pack the REAL tool package, install it to an
  # isolated --tool-path, run `skills install` + `--version`, and FAIL if the skills/ payload
  # is missing, an installed SKILL.md is unstamped, or --version reports drift. This catches a
  # "build-green-but-package-broken" state the build/test suite cannot see (it asserts against
  # $(OutDir), not the packaged artifact — exactly how #169 shipped broken across preview.27–30).
  # Ubuntu alone suffices: the bug was platform-agnostic, and the script is the same one the
  # release pipeline runs as a pre-publish gate.
  packaged-tool-smoke:
    name: packaged-tool-smoke (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Smoke (pack → install → assert)
        run: .github/scripts/smoke-packaged-tool.sh
